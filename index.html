<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会议纪要 · Meeting Minutes Studio</title>
<meta name="description" content="实时记录会议语音，自动生成英文 / 中文双语会议纪要，一键导出 PDF。">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E7%BA%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar no-print">
  <div class="brand">
    <div class="brand__mark">纪</div>
    <div class="brand__text">
      <strong>会议纪要</strong>
      <span>Meeting Minutes Studio</span>
    </div>
  </div>

  <div class="topbar__actions">
    <span id="engineBadge" class="badge" data-tone="local">本地提取</span>
    <button class="btn btn--ghost" id="btnSettings" type="button">设置</button>
    <button class="btn btn--primary" id="btnGenerate" type="button">生成纪要</button>
    <details class="menu" id="exportMenu">
      <summary class="btn btn--ghost">导出</summary>
      <div class="menu__list">
        <button type="button" data-export="print">打印 / 存为 PDF</button>
        <button type="button" data-export="md">Markdown (.md)</button>
        <button type="button" data-export="json">数据 (.json)</button>
        <button type="button" data-export="txt">纯文本 (.txt)</button>
      </div>
    </details>
  </div>
</header>

<main class="workspace">

  <!-- ───────────── 左：记录 ───────────── -->
  <section class="pane pane--src no-print">
    <div class="pane__head">
      <h2>记录 <small>Transcript</small></h2>
      <div class="rec">
        <select id="langSel" class="select" title="识别语言">
          <option value="zh-CN">中文</option>
          <option value="en-US">English</option>
          <option value="mixed">中英混合</option>
        </select>
        <span class="timer" id="timer">00:00</span>
        <button id="btnMic" class="btn btn--mic" type="button" title="开始实时记录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>开始录音</span>
        </button>
      </div>
    </div>

    <div class="transcript-wrap">
      <textarea id="transcript" class="transcript" spellcheck="false"
        placeholder="点「开始录音」实时识别语音，或直接粘贴 / 导入会议文字…&#10;&#10;支持中文、英文与中英混合；识别结果可随时手动修改。"></textarea>
      <div class="interim" id="interim" aria-live="polite"></div>
    </div>

    <div class="pane__foot">
      <span id="charCount">0 字</span>
      <div class="foot__actions">
        <button class="link" id="btnImport" type="button">导入文件</button>
        <button class="link" id="btnDemo" type="button">示例</button>
        <button class="link" id="btnClear" type="button">清空</button>
        <input type="file" id="fileInput" accept=".txt,.md,.json,.vtt,.srt,text/*" hidden>
      </div>
    </div>
  </section>

  <!-- ───────────── 右：纪要 ───────────── -->
  <section class="pane pane--out">
    <div class="pane__head no-print">
      <h2>纪要 <small>Minutes</small></h2>
      <div class="seg" id="viewSeg" role="tablist" aria-label="视图">
        <button type="button" class="seg__btn is-active" data-view="bi">双语</button>
        <button type="button" class="seg__btn" data-view="zh">中文</button>
        <button type="button" class="seg__btn" data-view="en">English</button>
      </div>
    </div>

    <div class="pane__body">
      <article id="minutes" class="minutes" contenteditable="false" spellcheck="false"></article>
      <div id="emptyState" class="empty">
        <div class="empty__icon">📝</div>
        <h3>还没有纪要</h3>
        <p>左侧录入或粘贴会议内容后，点右上角<strong>生成纪要</strong>。<br>
           纯本地运行：不联网也能提取结构；配置 AI 后可生成真正的英文 + 中文双语纪要。</p>
      </div>
    </div>
  </section>
</main>

<!-- ───────────── 设置 ───────────── -->
<dialog id="dlgSettings" class="dialog">
  <form method="dialog" class="dialog__form">
    <header>
      <h3>设置</h3>
      <button class="icon-btn" value="cancel" aria-label="关闭">✕</button>
    </header>

    <label class="field">
      <span>生成引擎</span>
      <select id="engineSel">
        <option value="local">本地提取（无需联网，单语 + 双语模板）</option>
        <option value="ai">AI 双语（OpenAI 兼容接口，生成中英对照）</option>
      </select>
    </label>

    <div id="aiFields" hidden>
      <label class="field">
        <span>接口地址</span>
        <input id="apiBase" type="url" placeholder="https://api.deepseek.com/chat/completions" spellcheck="false">
      </label>
      <label class="field">
        <span>模型</span>
        <input id="apiModel" type="text" placeholder="deepseek-chat" spellcheck="false">
      </label>
      <label class="field">
        <span>API Key</span>
        <input id="apiKey" type="password" placeholder="sk-…" spellcheck="false" autocomplete="off">
      </label>
      <p class="hint">Key 仅保存在本机浏览器 localStorage，请求由浏览器直连接口。若接口不支持跨域（CORS），请改用本地提取。</p>
    </div>

    <label class="field">
      <span>会议信息</span>
      <input id="metaTitle" type="text" placeholder="会议主题（选填）">
    </label>
    <label class="field">
      <span>参会人</span>
      <input id="metaAttendees" type="text" placeholder="用逗号分隔，如：张伟, 李娜, John">
    </label>

    <footer>
      <button class="btn btn--ghost" value="cancel">取消</button>
      <button class="btn btn--primary" id="btnSaveSettings" value="save">保存</button>
    </footer>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
